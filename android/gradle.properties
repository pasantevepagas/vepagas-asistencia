vepagas.listaSesiones=4c891357-bf2f-4d15-b11d-e6dcebe0594c
vepagas.listaUbicacionApp=0db18377-7726-4477-a28f-1961d0d29dde

# Repo PÚBLICO donde GitHub Actions publica las APK (owner/nombre)
