# ---------------------------------------------------------------------------
# Configuración de la app. NINGUNO de estos valores es secreto: la app se
# autentica con la cuenta de cada empleado (MSAL) y no lleva CLIENT_SECRET.
# ---------------------------------------------------------------------------
# Tenant Microsoft 365 de VEPAGAS
vepagas.tenantId=6274d019-dd03-4161-ac29-43150d955307
# "Application (client) ID" del registro "VEPAGAS Asistencia APK" en Entra (cliente público, sin secreto)
vepagas.msalClientId=858d9c9d-c8d5-495c-bea9-3b8ddd5b3a84

# Sitio "Desarrollo de Aplicaciones Power App" y listas de SharePoint
vepagas.siteId=13ae59be-bf9a-48bf-ad42-5c4bd9006f6f
vepagas.listaRegistros=4b0e7fd2-e8dc-449d-881e-10acff004151
vepagas.listaUbicaciones=26a50701-8c71-4fb8-b629-19f62b67eb29
