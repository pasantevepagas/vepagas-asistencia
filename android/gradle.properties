#  debug   = keystore de depuración de este PC   (SHA-1 90:1B:5D:...:58:23)
#  release = Documents\VepagasClaves\vepagas-release.jks (SHA-1 FA:9A:86:...:45:45)
vepagas.firmaHashDebug=kBtdKwOzJJkPRXJJG0iJog8DWCM=
vepagas.firmaHashRelease=+pqGoaywt0GyhvkUiYCuDVwnRUU=
