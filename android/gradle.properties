org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Configuración por entorno de la app (NO son secretos; nunca poner aquí
# CLIENT_SECRET de Entra ni claves del backend). Se pueden sobreescribir en
# ~/.gradle/gradle.properties o con -Pvepagas.apiUrlRelease=... al compilar.
# ---------------------------------------------------------------------------
# Debug: 127.0.0.1 + `adb reverse tcp:5080 tcp:5080` (sirve para emulador y teléfono por USB).
# Alternativa sin cable: la IP LAN del PC, p. ej. http://192.168.x.x:5080/api/
vepagas.apiUrlDebug=http://127.0.0.1:5080/api/
# Release: SIEMPRE https.
vepagas.apiUrlRelease=https://asistencia.vepagas.example/api/
# Client ID OAuth de tipo "Web application" en Google Cloud (el mismo que Auth:GoogleClientIds del backend).
vepagas.googleWebClientId=759384466492-cavivj20deoo86i5oknmc9oj307kvuve.apps.googleusercontent.com
