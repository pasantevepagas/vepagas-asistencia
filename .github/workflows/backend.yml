# Despliega el backend en el IIS de VEPAGAS en cada push a main que toque backend/.
# Corre en un runner self-hosted instalado EN el servidor (etiqueta: vepagas-iis).
# Variables del repo (Settings > Secrets and variables > Actions > Variables):
#   IIS_SITE_PATH  carpeta física del sitio, p. ej. C:\inetpub\vepagas-asistencia
#   API_URL        URL pública con / final, p. ej. https://asistencia.vepagas.com/api/
name: Backend - desplegar en IIS

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency: despliegue-backend

jobs:
  desplegar:
    runs-on: [self-hosted, windows, vepagas-iis]
    steps:
      - uses: actions/checkout@v4

      - name: Publicar
        shell: powershell
        run: dotnet publish backend/Vepagas.Asistencia.Api -c Release -o publish --nologo

      - name: Copiar al sitio IIS
        shell: powershell
        run: |
          $sitio = "${{ vars.IIS_SITE_PATH }}"
          if (-not $sitio) { throw "Falta la variable IIS_SITE_PATH" }
          # app_offline.htm detiene la app de forma ordenada mientras se copian los archivos.
          Set-Content "$sitio\app_offline.htm" "<h1>Actualizando, vuelva en unos segundos</h1>"
          Start-Sleep -Seconds 3
          # /MIR sin tocar la config del servidor, datos ni logs.
          robocopy publish $sitio /MIR /R:3 /W:2 /NFL /NDL /NP `
            /XF appsettings.Production.json app_offline.htm `
            /XD App_Data actualizaciones logs
          if ($LASTEXITCODE -ge 8) { Remove-Item "$sitio\app_offline.htm" -ErrorAction SilentlyContinue; throw "robocopy falló ($LASTEXITCODE)" }
          Remove-Item "$sitio\app_offline.htm"
          exit 0

      - name: Verificar que responde
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $r = Invoke-RestMethod "${{ vars.API_URL }}salud" -TimeoutSec 30
          if ($r.estado -ne "ok") { throw "El backend no respondió correctamente" }
          "Backend OK: $($r.horaServidorUtc)"
