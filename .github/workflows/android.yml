# En cada push a main que toque android/: compila la APK firmada y la publica como Release en el
# repo PÚBLICO de releases. Las apps instaladas detectan la nueva versión al abrirse y ofrecen actualizar.
#
# Secrets del repo (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   RELEASES_TOKEN   PAT fine-grained con "Contents: Read and write" SOLO sobre el repo de releases
# Variables (opcionales):
#   RELEASES_REPO              owner/repo público (por defecto el de android/gradle.properties)
#   ACTUALIZACION_OBLIGATORIA  "true" para obligar a actualizar
name: Android - compilar y publicar APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      notas:
        description: 'Notas de la versión (se muestran al empleado)'
        required: false

concurrency: release-android

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Keystore de firma
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > vepagas-release.jks
          cat > keystore.properties <<EOF
          storeFile=vepagas-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Compilar APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pvepagas.versionCode=$((100 + VERSION_CODE)) \
            -Pvepagas.versionName=$VERSION_NAME

      - name: Preparar artefactos
        run: |
          mkdir salida
          cp android/app/build/outputs/apk/release/app-release.apk salida/vepagas-asistencia.apk
          SHA=$(sha256sum salida/vepagas-asistencia.apk | cut -d' ' -f1)
          NOTAS='${{ github.event.inputs.notas }}'
          [ -z "$NOTAS" ] && NOTAS=$(git log -1 --pretty=%s)
          jq -n --argjson vc $((100 + VERSION_CODE)) --arg vn "$VERSION_NAME" --arg sha "$SHA" \
                --arg notas "$NOTAS" --argjson obl "${{ vars.ACTUALIZACION_OBLIGATORIA == 'true' }}" \
                '{versionCode:$vc, versionName:$vn, sha256:$sha, obligatoria:$obl, notas:$notas}' > salida/version.json
          cat salida/version.json

      - name: Publicar en el repo público de releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          REPO="${{ vars.RELEASES_REPO }}"
          [ -z "$REPO" ] && REPO=$(grep '^vepagas.releasesRepo=' android/gradle.properties | cut -d= -f2)
          gh release create "v$VERSION_NAME" salida/vepagas-asistencia.apk salida/version.json \
            -R "$REPO" --title "VEPAGAS Asistencia $VERSION_NAME" --notes-file <(jq -r .notas salida/version.json)
