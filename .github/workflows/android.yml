# Compila la APK firmada en cada push a main que toque android/, crea un GitHub Release
# y la publica en el servidor para que las apps instaladas se actualicen.
# Secrets del repo:
#   ANDROID_KEYSTORE_BASE64  keystore de release en base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Variables del repo:
#   API_URL                  URL pública HTTPS con / final (la misma del workflow backend)
#   CARPETA_ACTUALIZACIONES  en el servidor, p. ej. C:\VepagasAsistencia\actualizaciones
#   ACTUALIZACION_OBLIGATORIA  "true" para obligar a actualizar (opcional)
name: Android - compilar y publicar APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      notas:
        description: 'Notas de la versión (se muestran al empleado)'
        required: false

permissions:
  contents: write

concurrency: release-android

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Keystore de firma
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > vepagas-release.jks
          cat > keystore.properties <<EOF
          storeFile=vepagas-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Compilar APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pvepagas.versionCode=$((100 + VERSION_CODE)) \
            -Pvepagas.versionName=$VERSION_NAME \
            -Pvepagas.apiUrlRelease=${{ vars.API_URL }}

      - name: Preparar artefactos
        run: |
          mkdir salida
          cp android/app/build/outputs/apk/release/app-release.apk salida/vepagas-asistencia.apk
          SHA=$(sha256sum salida/vepagas-asistencia.apk | cut -d' ' -f1)
          NOTAS='${{ github.event.inputs.notas }}'
          [ -z "$NOTAS" ] && NOTAS=$(git log -1 --pretty=%s)
          jq -n --argjson vc $((100 + VERSION_CODE)) --arg vn "$VERSION_NAME" --arg sha "$SHA" \
                --arg notas "$NOTAS" --argjson obl "${{ vars.ACTUALIZACION_OBLIGATORIA == 'true' }}" \
                '{versionCode:$vc, versionName:$vn, sha256:$sha, obligatoria:$obl, notas:$notas}' > salida/version.json
          cat salida/version.json

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION_NAME" salida/vepagas-asistencia.apk salida/version.json --title "VEPAGAS Asistencia $VERSION_NAME" --notes-file <(jq -r .notas salida/version.json)

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: salida/

  publicar-en-servidor:
    needs: compilar
    runs-on: [self-hosted, windows, vepagas-iis]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: salida

      - name: Copiar a la carpeta de actualizaciones
        shell: powershell
        run: |
          $dest = "${{ vars.CARPETA_ACTUALIZACIONES }}"
          if (-not $dest) { throw "Falta la variable CARPETA_ACTUALIZACIONES" }
          New-Item -ItemType Directory -Force $dest | Out-Null
          # Primero la APK y al final version.json: las apps nunca ven una versión sin su archivo.
          Copy-Item salida\vepagas-asistencia.apk "$dest\vepagas-asistencia.apk.tmp" -Force
          Move-Item "$dest\vepagas-asistencia.apk.tmp" "$dest\vepagas-asistencia.apk" -Force
          Copy-Item salida\version.json "$dest\version.json" -Force
          Get-Content "$dest\version.json"
